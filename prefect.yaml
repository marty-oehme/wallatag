# Prefect deployment definitions for wallatag.
#
# Prefect is the sole scheduler for wallatag. The code and the deployment live
# in the same repo and are deployed to the same Dokku app, so there is no pull
# step: the worker (a Procfile process joining the `wallatag-pool` work pool)
# runs the flow from the code already deployed in /app.
#
# The Dokku release phase (Procfile `release:`) registers this deployment on
# every push: deploy/release.py ensures the `wallatag-pool` work pool exists,
# then runs `prefect deploy --all`. Requires PREFECT_API_URL (and
# PREFECT_API_KEY if the server enforces auth) via `dokku config:set`.
#
# LLM settings for Prefect-scheduled runs come from the `LLMCredentials` block
# (document `wallatag-llm`, blocks.py): provider, base_url, model,
# confidence_threshold, and an OPTIONAL api_key. The release phase auto-creates
# it (deploy/release.py): seeded from the WALLATAG_AI_* env vars when the
# provider/base_url/model trio is set (api key too when present), else created
# empty; it can be filled/edited in the Prefect UI without redeploying.
#
# The flow (prefect_flows.py) reads the block every run and passes its
# non-empty fields to the wallatag CLI as WALLATAG_AI_* env vars. The block
# provides DEFAULTS for scheduled runs; WALLATAG_AI_* container env vars
# (dokku config:set) override them. Precedence, lowest to highest:
# wallatag.toml defaults → LLM block fields → container env vars → CLI
# options (none exist for AI config today). Empty block fields fall back to
# TOML/config env. To CLEAR a block value, `dokku config:unset` it: do NOT
# `config:set` it to "": a present-but-empty WALLATAG_AI_* var overrides the
# block with "" and fails wallatag's config validation (ConfigError), except
# WALLATAG_AI_API_KEY="" which intentionally clears the api key. No secrets
# land in git either way.
#
# Wallabag URL/credentials for Prefect-scheduled runs come from the
# `WallabagCredentials` block (document `wallabag`, blocks.py): base_url,
# client_id, client_secret, username, password. The release phase auto-creates
# it (deploy/release.py): seeded from the WALLATAG_* env vars when all five
# are set, else created empty; it can be filled/edited in the Prefect UI
# without redeploying. The block document name `wallabag` is shared with the
# morning-digest project, so one block serves both.
#
# The flow (prefect_flows.py) reads the block every run and passes its
# non-empty fields to the wallatag CLI as WALLATAG_* env vars. The block
# provides DEFAULTS for scheduled runs; WALLATAG_* container env vars (dokku
# config:set) override them. Precedence, lowest to highest: wallatag.toml
# defaults → wallabag-credentials block fields → container env vars. Empty
# block fields fall back to TOML/config env. To CLEAR a block value,
# `dokku config:unset` it: do NOT `config:set` it to "": a present-but-empty
# WALLATAG_* var overrides the block with "" and fails wallatag's config
# validation (ConfigError). No secrets land in git either way.
#
# Scalar settings can also come from Prefect Variables (Variables page,
# workspace- or deployment-scoped): WALLATAG_TAG_POLICY, WALLATAG_MAX_APPLIED_TAGS,
# WALLATAG_IGNORE_TAGS, WALLATAG_ENABLE_VOCABULARY, WALLATAG_ENABLE_RULES,
# WALLATAG_ENABLE_LLM, WALLATAG_AI_CONFIDENCE_THRESHOLD,
# WALLATAG_AI_USE_FOCUS_GROUPS, WALLATAG_AI_MAX_PROPOSALS,
# WALLATAG_VOCABULARY_FIELDS (names mirror the env
# vars exactly), plus ONE JSON variable WALLATAG_FOCUS_GROUPS mapping group
# names to {keywords, tags, fields, keywords_regex}. The flow reads them every
# run and passes
# them to the wallatag CLI as WALLATAG_* env vars. Precedence, lowest to
# highest: wallatag.toml defaults → blocks → container env vars (dokku
# config:set) → Prefect Variables → CLI options (--tag-policy/--focus). Missing
# variables fall through to env/TOML. The flow's `focus` parameter is a
# comma-separated list of group names emitted as repeated --focus flags; the
# CLI never splits on commas, so comma-containing group names are only
# selectable via the CLI. Secrets (client_secret, password,
# api_key) never come from variables. Do NOT auto-seed variables in
# deploy/release.py: they are user-edited in the UI and would be clobbered on
# every push.

build: null
push: null

pull:
- prefect.deployments.steps.set_working_directory:
    directory: /app

deployments:
- name: wallatag-batch
  entrypoint: prefect_flows.py:wallatag_batch
  parameters:
    max_articles: 50
  schedule:
    cron: "0 5,17 * * *"
    timezone: UTC
  work_pool:
    name: wallatag-pool
  tags:
  - wallatag
