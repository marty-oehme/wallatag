[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wallatag"
version = "0.1.0"
description = "AI-assisted auto-tagger for wallabag"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3"]

[project.scripts]
wallatag = "wallatag.cli:main"

[tool.setuptools.packages.find]
include = ["wallatag*"]

[dependency-groups]
dev = ["ruff>=0.9,<1", "mypy>=2.4,<3"]
# tzdata: defensive pin for containers that lack a system tz database
# (prefect only pulls it for win32/<3.13 otherwise).
prefect = ["prefect>=3.1", "tzdata"]

[tool.ruff]
# Explicit pyflakes-level rule set: ruff >=0.16 expanded the default
# selection beyond E4/E7/E9/F, which would flag deliberate patterns
# (broad catches, ValueError validation). Formatting stays in `ruff format`.
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# Scope: the runtime package plus the optional Prefect integration entry
# points. Tests stay out (stdlib unittest suite, no pytest migration).
files = ["wallatag", "flows.py", "blocks.py", "deploy/release.py"]
python_version = "3.11"
# Non-strict, but still checks the bodies of functions with no annotations
# -- which is where the real bugs hide in a small codebase. Missing
# annotations are NOT errors yet; see a62e58d.
check_untyped_defs = true
# Missing imports are real errors: the wallatag package must stay
# Prefect-free (no silent ignore of a leaked flows.py import).
ignore_missing_imports = false
