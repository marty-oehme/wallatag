[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wallatag"
# Single-sourced from wallatag/__init__.py. setuptools reads the attribute
# via AST, so the build never imports the package or its dependencies.
dynamic = ["version"]
description = "AI-assisted auto-tagger for wallabag"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marty Oehme", email = "contact@martyoeh.me" }]
keywords = ["wallabag", "tagging", "tags", "cli", "llm", "automation"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Utilities",
]
dependencies = ["requests>=2.31,<3"]

[project.optional-dependencies]
# End-user install of the optional Prefect integration:
#   pip install "wallatag[prefect]"
# Prefect is never a base dependency.
prefect = ["prefect>=3.1", "tzdata"]

[project.urls]
Homepage = "https://github.com/marty-oehme/wallatag"
Repository = "https://github.com/marty-oehme/wallatag"
Issues = "https://github.com/marty-oehme/wallatag/issues"
Documentation = "https://github.com/marty-oehme/wallatag/tree/main/docs"

[project.scripts]
wallatag = "wallatag.cli:main"

[tool.setuptools.packages.find]
include = ["wallatag*"]

[tool.setuptools.package-data]
# The annotated starter config is read at runtime via importlib.resources
# (wallatag config init), so it must ship inside the installed package.
wallatag = ["wallatag.toml.example"]

[tool.setuptools.dynamic]
# `${attr}` is parsed from the AST, not imported: no runtime dependency is
# needed at build time, and there is exactly one place to bump the version.
version = { attr = "wallatag.__version__" }

[dependency-groups]
dev = ["ruff>=0.9,<1", "mypy>=2.4,<3"]
# tzdata: defensive pin for containers that lack a system tz database
# (prefect only pulls it for win32/<3.13 otherwise).
prefect = ["prefect>=3.1", "tzdata"]

[tool.ruff]
# Explicit pyflakes-level rule set: ruff >=0.16 expanded the default
# selection beyond E4/E7/E9/F, which would flag deliberate patterns
# (broad catches, ValueError validation). Formatting stays in `ruff format`.
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# Scope: the runtime package plus the optional Prefect integration entry
# points. Tests stay out (stdlib unittest suite, no pytest migration).
files = ["wallatag", "flows.py", "blocks.py", "deploy/release.py"]
python_version = "3.11"
# Non-strict, but still checks the bodies of functions with no annotations.
# Missing annotations are NOT errors (yet).
check_untyped_defs = true
# Missing imports are real errors: the wallatag package must stay
# Prefect-free (no silent ignore of a leaked flows.py import).
ignore_missing_imports = false
